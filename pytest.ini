[pytest]
addopts =
    --html=reports/report.html
    --self-contained-html
    --capture=no
    -v

markers =
    # Feature-based markers
    auth: Tests related to user login, profile retrieval, and authentication security
    products: Tests for product listing, searching, pagination, and details
    carts: Tests covering cart creation, updates, deletion, and management

    # Scope-based markers
    smoke: Critical path tests used to verify basic system stability after a deployment
    regression: Comprehensive tests to ensure existing functionality remains intact after changes

testpaths = steps


filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore::_pytest.warning_types.PytestDeprecationWarning:pytest_parallel
